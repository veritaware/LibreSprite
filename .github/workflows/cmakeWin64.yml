name: Windows x86_64

on:
  push:
    branches: [ trunk ]
    tags:
      - '*'
  pull_request:
    branches: [ trunk ]

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, 'NO_SW_CHANGE') && !contains(github.event.pull_request.body, 'NO_SW_CHANGE') }}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-x86_64-nodejs
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-giflib
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-pixman
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-tinyxml2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libarchive
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Check for git tag
      id: check_tag
      shell: bash
      run: |
        TAG=$(git describe --exact-match --tags 2>/dev/null) || true
        if [ -n "$TAG" ]; then
          echo "has_tag=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        else
          echo "has_tag=false" >> $GITHUB_OUTPUT
        fi
    - name: Get short commit hash
      id: commit
      shell: bash
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
    - name: Update config.h with commit hash
      shell: bash
      run: |
        sed -i 's/#define COMMIT  "local build"/#define COMMIT  "${{ steps.commit.outputs.short_hash }}"/g' src/config.h
    - name: Generate Makefiles
      shell: msys2 {0}
      run: |
        mkdir build
        if [ "${{ steps.check_tag.outputs.has_tag }}" = "true" ]; then
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DRELEASE_TAG=ON ..
        else
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        fi
    - name: Build the binaries
      shell: msys2 {0}
      run: |
        make -C build besprited -j 4
        # Building only the 'besprited' target already keeps gen.exe, qjs/qjsc
        # and the *_tests binaries out of build/bin; this is a defensive sweep so
        # nothing but the editor can end up in the portable ZIP or the installer.
        find build/bin -maxdepth 1 -type f -name '*.exe' ! -name 'besprited.exe' -delete
        node packaging/package_win.js build/bin/besprited.exe
    - name: Upload portable archive
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.check_tag.outputs.has_tag == 'true' && format('besprited-{0}-windows-x86_64', steps.check_tag.outputs.tag) || 'besprited-windows-x86_64' }}
        path: |
          build/bin/*
    - name: Package the portable archive
      if: steps.check_tag.outputs.has_tag == 'true'
      shell: bash
      run: |
        ZIP="besprited-${{ steps.check_tag.outputs.tag }}-windows-x86_64.zip"
        (cd build/bin && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/$ZIP" .)
        echo "zip=$ZIP" >> $GITHUB_OUTPUT
      id: portable
    - name: Build the installer
      if: steps.check_tag.outputs.has_tag == 'true'
      shell: bash
      run: |
        choco install innosetup --no-progress -y
        VERSION="${{ steps.check_tag.outputs.tag }}"
        VERSION="${VERSION#v}"
        MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
          "/DMyAppVersion=${VERSION}" \
          packaging/WindowsInstaller.iss
    - name: Upload installer
      if: steps.check_tag.outputs.has_tag == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: besprited-${{ steps.check_tag.outputs.tag }}-windows-x86_64-installer
        path: packaging/besprited-*-windows-x86_64.exe
        if-no-files-found: error
    - name: Attach binaries to the release
      if: steps.check_tag.outputs.has_tag == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.portable.outputs.zip }}
          packaging/besprited-*-windows-x86_64.exe
        fail_on_unmatched_files: true
